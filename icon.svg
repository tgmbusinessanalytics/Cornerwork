<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2230"/>
      <stop offset="1" stop-color="#080A0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865F2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AA5FF"/>
      <stop offset="1" stop-color="#4A57E8"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFB27A"/>
      <stop offset="1" stop-color="#F2722B"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softDot" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>

  <!-- ring glow -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#5865F2" stroke-width="110" stroke-linecap="round"
          stroke-dasharray="1178 393" transform="rotate(45 512 512)" opacity="0.55" filter="url(#soft)"/>
  <!-- the C: a progress ring left open on the right -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="url(#ring)" stroke-width="110" stroke-linecap="round"
          stroke-dasharray="1178 393" transform="rotate(45 512 512)"/>

  <!-- boxing accent in the gap -->
  <circle cx="762" cy="512" r="56" fill="#FF8A3D" opacity="0.6" filter="url(#softDot)"/>
  <circle cx="762" cy="512" r="52" fill="url(#dot)"/>
</svg>
