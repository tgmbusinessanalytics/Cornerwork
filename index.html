<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080A0F">
<title>CORNERWORK</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cornerwork">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --bg:#080A0F;
  --bg2:#10131A;
  --card:#151922;
  --card-elev:#1C212C;
  --text:#FFFFFF;
  --text2:#9299A8;
  --border:#272D38;
  --accent:#5865F2;
  --success:#35D07F;
  --hiit:#FF4D67;
  --boxing:#FF8A3D;
  --strength:#5B7CFF;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:26px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;

  --shadow:0 8px 28px rgba(0,0,0,.45);
  --inset:inset 0 1px 0 rgba(255,255,255,.04);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}
button,input,select{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;}
input,select{outline:none;}
::-webkit-scrollbar{width:0;height:0;}

#app{
  position:relative;
  width:100%;
  max-width:480px;
  min-height:100dvh;
  background:
    radial-gradient(900px 420px at 100% -8%, rgba(88,101,242,.13), transparent 62%),
    radial-gradient(720px 380px at -10% 10%, rgba(255,138,61,.06), transparent 60%),
    var(--bg);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ---------- type ---------- */
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0;}
.h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0;}
.h3{font-size:14px;font-weight:600;letter-spacing:-.01em;margin:0;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);}
.muted{color:var(--text2);}
.small{font-size:12.5px;}
.tiny{font-size:11px;}
.metric{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;}
.metric-sm{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;}

/* ---------- layout ---------- */
#saveWarning{
  display:none;
  background:linear-gradient(90deg,rgba(255,77,103,.2),rgba(255,77,103,.08));
  border-bottom:1px solid rgba(255,77,103,.3);
  color:#FFD7DD;
  font-size:12px;
  padding:10px var(--s5);
  line-height:1.4;
  flex-shrink:0;
}
#saveWarning.show{display:block;}

#screen{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
#screen.no-nav{padding-bottom:env(safe-area-inset-bottom);}

.topbar{
  display:flex;align-items:center;gap:var(--s3);
  padding:calc(18px + env(safe-area-inset-top)) var(--s5) var(--s4);
}
.topbar .spacer{flex:1;}
.iconbtn{
  width:38px;height:38px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text2);
  flex-shrink:0;transition:transform .12s,background .18s,color .18s;
}
.iconbtn:active{transform:scale(.92);background:var(--card-elev);color:var(--text);}
.pad{padding:0 var(--s5);}
.section{margin-top:var(--s6);}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s3);}
.link{color:var(--accent);font-size:12.5px;font-weight:600;}

/* ---------- cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow),var(--inset);
  padding:var(--s5);
}
.card.elev{background:var(--card-elev);}
.card.flat{box-shadow:none;}
.card.tap{transition:transform .12s ease,border-color .18s;}
.card.tap:active{transform:scale(.985);border-color:#333B49;}
.row{display:flex;align-items:center;gap:var(--s3);}
.col{display:flex;flex-direction:column;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);}

/* ---------- chips / pills ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  font-size:11.5px;font-weight:600;color:var(--text2);white-space:nowrap;
}
.chip.accent{background:rgba(88,101,242,.14);border-color:rgba(88,101,242,.35);color:#AEB6FF;}
.chip.boxing{background:rgba(255,138,61,.13);border-color:rgba(255,138,61,.32);color:#FFB983;}
.chip.hiit{background:rgba(255,77,103,.13);border-color:rgba(255,77,103,.32);color:#FF97A8;}
.chip.strength{background:rgba(91,124,255,.13);border-color:rgba(91,124,255,.32);color:#A3B6FF;}
.chip.success{background:rgba(53,208,127,.13);border-color:rgba(53,208,127,.32);color:#7BE3AE;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  height:54px;border-radius:var(--r-md);
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  background:var(--card-elev);border:1px solid var(--border);color:var(--text);
  width:100%;transition:transform .12s ease,filter .18s;
}
.btn:active{transform:scale(.975);filter:brightness(1.15);}
.btn.primary{
  background:linear-gradient(135deg,#6B77FF,#4A57E8);
  border-color:transparent;
  box-shadow:0 8px 24px rgba(88,101,242,.35),var(--inset);
}
.btn.boxing{background:linear-gradient(135deg,#FF9A55,#F2722B);box-shadow:0 8px 24px rgba(255,138,61,.32),var(--inset);border-color:transparent;}
.btn.hiit{background:linear-gradient(135deg,#FF6076,#EE3552);box-shadow:0 8px 24px rgba(255,77,103,.32),var(--inset);border-color:transparent;}
.btn.success{background:linear-gradient(135deg,#45DE8E,#22B86A);box-shadow:0 8px 24px rgba(53,208,127,.3),var(--inset);border-color:transparent;color:#04240F;}
.btn.ghost{background:transparent;}
.btn.sm{height:42px;font-size:13.5px;border-radius:var(--r-sm);}
.btn:disabled{opacity:.4;}

/* ---------- inputs ---------- */
.field{margin-bottom:var(--s3);}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;}
.input{
  width:100%;height:50px;padding:0 var(--s4);
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);
  font-size:16px;font-weight:600;color:var(--text);
  transition:border-color .18s,box-shadow .18s;
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,101,242,.16);}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;background-size:5px 5px;background-repeat:no-repeat;}

/* ---------- progress ---------- */
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6B77FF,#8E9BFF);transition:width .5s cubic-bezier(.4,0,.2,1);}
.bar.success > i{background:linear-gradient(90deg,#2BC978,#5BE6A4);}
.bar.boxing > i{background:linear-gradient(90deg,#F2722B,#FFAE6E);}
.bar.hiit > i{background:linear-gradient(90deg,#EE3552,#FF8398);}
.bar.lg{height:10px;}

.ring-wrap{position:relative;display:grid;place-items:center;}
.ring-svg{transform:rotate(-90deg);display:block;}
.ring-track{fill:none;stroke:rgba(255,255,255,.07);}
.ring-fill{fill:none;stroke-linecap:round;transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}

/* ---------- stat tiles ---------- */
.tile{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--s4);box-shadow:var(--inset);
}
.tile .tv{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;}
.tile .tl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-top:4px;}

/* ---------- list rows ---------- */
.lrow{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s3) 0;border-top:1px solid var(--border);
}
.lrow:first-child{border-top:none;}
.lrow .idx{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text2);
}
.lrow.done .idx{background:rgba(53,208,127,.15);border-color:rgba(53,208,127,.4);color:var(--success);}
.lrow.done .nm{color:var(--text2);}
.nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
.sb{font-size:12px;color:var(--text2);margin-top:1px;}

.acc-strip{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;}

/* ---------- bottom nav ---------- */
#nav{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;
  background:rgba(16,19,26,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:20;
}
#nav.hidden{display:none;}
#nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 0 9px;color:var(--text2);
  font-size:10px;font-weight:600;letter-spacing:.02em;
  transition:color .18s,transform .12s;
}
#nav button:active{transform:scale(.9);}
#nav button.on{color:var(--accent);}
#nav button .ind{
  position:absolute;top:0;width:26px;height:2px;border-radius:0 0 3px 3px;
  background:var(--accent);box-shadow:0 0 12px rgba(88,101,242,.8);
  opacity:0;transition:opacity .2s;
}
#nav button.on .ind{opacity:1;}

/* ---------- splash ---------- */
.splash{
  position:relative;min-height:100dvh;display:flex;flex-direction:column;
  justify-content:flex-end;padding:var(--s6) var(--s5) calc(var(--s7) + env(safe-area-inset-bottom));
  overflow:hidden;
}
.splash-bg{position:absolute;inset:0;z-index:0;}
.splash-bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(620px 500px at 76% 16%, rgba(88,101,242,.42), transparent 66%),
    radial-gradient(540px 460px at 16% 44%, rgba(255,138,61,.20), transparent 64%),
    radial-gradient(700px 560px at 50% 106%, rgba(255,77,103,.16), transparent 62%),
    linear-gradient(180deg,#0C1018 0%,#080A0F 58%);
}
.splash-bg::after{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(102deg, rgba(255,255,255,.045) 0 1px, transparent 1px 30px),
    linear-gradient(180deg, transparent 26%, rgba(8,10,15,.88) 76%, #080A0F 100%);
}
.splash-mark{
  position:absolute;top:14%;left:50%;transform:translateX(-50%);
  width:230px;height:230px;border-radius:50%;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 90px rgba(88,101,242,.4),inset 0 0 70px rgba(88,101,242,.14);
  display:grid;place-items:center;z-index:1;
  animation:pulse 4.5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.95;}50%{transform:translateX(-50%) scale(1.045);opacity:1;}}
.splash-content{position:relative;z-index:2;}
.splash h1{
  font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:1.02;margin:0 0 var(--s3);
  text-transform:uppercase;
}
.splash h1 em{font-style:normal;background:linear-gradient(100deg,#8E9BFF,#5865F2);-webkit-background-clip:text;background-clip:text;color:transparent;}
.splash p{color:var(--text2);font-size:14.5px;margin:0 0 var(--s6);max-width:330px;}

/* ---------- overlays ---------- */
.ovl{
  position:absolute;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom));
  animation:slideUp .28s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{transform:translateY(3%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.ovl.boxing-theme{background:radial-gradient(700px 460px at 50% 22%, rgba(255,138,61,.17), transparent 66%),var(--bg);}
.ovl.hiit-theme{background:radial-gradient(700px 460px at 50% 22%, rgba(255,77,103,.17), transparent 66%),var(--bg);}
.ovl.work{background:radial-gradient(760px 500px at 50% 26%, rgba(255,77,103,.24), transparent 66%),var(--bg);}
.ovl.rest{background:radial-gradient(760px 500px at 50% 26%, rgba(53,208,127,.2), transparent 66%),var(--bg);}
.ovl.prep{background:radial-gradient(760px 500px at 50% 26%, rgba(88,101,242,.22), transparent 66%),var(--bg);}

.modal-bg{
  position:absolute;inset:0;z-index:80;background:rgba(4,6,10,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .2s ease;
}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{
  width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--s5) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
.grab{width:38px;height:4px;border-radius:999px;background:var(--border);margin:0 auto var(--s5);}
textarea.input{height:110px;padding:var(--s3) var(--s4);font-size:11px;font-family:ui-monospace,Menlo,monospace;font-weight:400;line-height:1.5;resize:vertical;}

/* ---------- animations ---------- */
@keyframes pop{0%{transform:scale(.7);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.3);}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(53,208,127,.55);}100%{box-shadow:0 0 0 22px rgba(53,208,127,0);}}
.flash{animation:flash .55s ease-out;}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
.fade-up{animation:fadeUp .34s cubic-bezier(.16,1,.3,1) both;}
@keyframes countPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.tick{animation:countPulse .5s ease;}
.blink{animation:blinkk 1.1s steps(2,start) infinite;}
@keyframes blinkk{0%,100%{opacity:1;}50%{opacity:.35;}}

.empty{
  text-align:center;color:var(--text2);font-size:13px;
  padding:var(--s7) var(--s5);
}
svg{display:block;}
</style>
</head>
<body>
<div id="app">
  <div id="saveWarning">Progress isn't saving — this browser is blocking storage (private mode can do this). Use Backup in Profile to copy your data out.</div>
  <div id="screen"></div>
  <nav id="nav"></nav>
  <div id="overlayRoot"></div>
</div>

function ico(n,s,w){
  return `<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round"><path d="${ICONS[n]}"/></svg>`;

/* =========================================================
   PLAN DATA
   ========================================================= */
const PLANS = {
  saturday:{
    key:'saturday', label:'Saturday',
    title:'Weightlifting + Boxing',

/* =========================================================

   ========================================================= */
const KEY='cornerwork_state_v2', KEY_V1='cornerwork_state_v1';

function blankState(){
  return {
    onboarded:false,
    profile:{name:'', level:'Intermediate', daysPerWeek:2, units:'kg'},
    settings:{startWeight:null, targetWeight:null, goal2:null, timelineWeeks:16, notifications:true},
    weightLog:[],        // {date, weight}
    sessions:[],         // {date, day, durationMin, calories, exCount, exTotal, boxingRounds, hiitRounds, volume}
    setLog:{},           // exId -> [{date, reps, weight}]
    nutrition:{},        // date -> {meals:[{id,type,name,kcal,p,c,f}], water}
    nutritionTargets:null,
    checked:{}
  };
}
let S = blankState();

// Claude's artifact host provides window.storage; a normal website (e.g. Vercel) falls back to localStorage.
const STORE = (()=>{
  const ws = window.storage;
  if(ws && typeof ws.get==='function' && typeof ws.set==='function'){
    return {get:k=>ws.get(k,false), set:(k,v)=>ws.set(k,v,false)};
  }
  try{
    const t='__cw_probe'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    return {get:k=>localStorage.getItem(k), set:(k,v)=>localStorage.setItem(k,v)};
  }catch(e){ return null; }
})();

function loadState(){
  try{
    const raw = STORE.get(KEY);
    if(raw && typeof raw.then==='function'){
      return raw.then(v=>{ hydrate(v); return migrateIfNeeded(); }).catch(e=>{console.error(e);});
    }
    hydrate(raw);
    return migrateIfNeeded();
  }catch(e){ console.error('load',e); return Promise.resolve(); }
}
function hydrate(raw){
  if(!raw) return;
  try{
    const p = JSON.parse(raw);
    const b = blankState();
    S = Object.assign(b, p);
    S.profile          = Object.assign(b.profile, p.profile||{});
    S.settings         = Object.assign(b.settings, p.settings||{});
    S.setLog           = p.setLog||{};
    S.nutrition        = p.nutrition||{};
    S.checked          = p.checked||{};
  }catch(e){ console.error('parse',e); }
}
function migrateIfNeeded(){
  if(S.onboarded || S.weightLog.length || S.sessions.length) return Promise.resolve();
  try{
    const old = STORE.get(KEY_V1);
    const apply = v => {
      if(!v) return;
      try{
        const p = JSON.parse(v);
        if(Array.isArray(p.weightLog)) S.weightLog = p.weightLog;
        if(Array.isArray(p.sessions))  S.sessions  = p.sessions;
        if(p.settings){
          S.settings.startWeight  = p.settings.startWeight ?? null;
          S.settings.targetWeight = p.settings.goal1 ?? null;
          S.settings.goal2        = p.settings.goal2 ?? null;
        }
        if(S.weightLog.length || S.sessions.length) S.onboarded = true;
      }catch(e){}
    };
    if(old && typeof old.then==='function') return old.then(apply).catch(()=>{});
    apply(old);
  }catch(e){}
  return Promise.resolve();
}
function save(){
  try{
    const r = STORE.set(KEY, JSON.stringify(S));
    if(r && typeof r.then==='function') r.then(hideWarn).catch(e=>{console.error(e);showWarn();});
    else hideWarn();
  }catch(e){ console.error('save',e); showWarn(); }
}
const warnEl=()=>document.getElementById('saveWarning');
function showWarn(){ warnEl().classList.add('show'); }
function hideWarn(){ warnEl().classList.remove('show'); }

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const r1 = n => Math.round(n*10)/10;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const round5 = n => Math.round(n/5)*5;

function clock(sec){
  sec = Math.max(0,Math.ceil(sec));
  const m=Math.floor(sec/60), s=sec%60;
  return `${m<10?'0':''}${m}:${s<10?'0':''}${s}`;
}
function iso(d){
  d = d||new Date();
  const m=d.getMonth()+1, day=d.getDate();
  return `${d.getFullYear()}-${m<10?'0':''}${m}-${day<10?'0':''}${day}`;
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(s){
  const [y,m,d]=s.split('-').map(Number);
  return `${MON[m-1]} ${d}`;
}
function daysAgo(s){
  const [y,m,d]=s.split('-').map(Number);
  const then=new Date(y,m-1,d), now=new Date();
  return Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-then)/86400000);
}
function relDate(s){
  const n=daysAgo(s);
  if(n===0) return 'Today';
  if(n===1) return 'Yesterday';
  if(n<7) return n+' days ago';
  return fmtDate(s);
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
function beep(freq,dur){
  try{
    const C=window.AudioContext||window.webkitAudioContext, c=new C();
    const o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,c.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(dur||.22));
    o.start(); o.stop(c.currentTime+(dur||.22)+.02);
    setTimeout(()=>{try{c.close();}catch(e){}},600);
  }catch(e){}
}

/* progression */
const levelOf = () => Math.min(5, Math.floor(S.sessions.length/3));
function scaleBox(work,rest,lv){
  return {work:round5(work*(1+lv*0.06)), rest: rest===0?0:Math.max(15,round5(rest*(1-lv*0.10)))};
}
function scaleHiit(work,rest,rounds,lv){
  return {work:Math.min(60,round5(work*(1+lv*0.08))), rest:Math.max(10,round5(rest*(1-lv*0.12))), rounds:rounds+Math.floor(lv/2)};
}

/* sequences */
function boxingSeq(block,lv){
  const steps=[{phase:'prep',label:'Get Ready',sub:block.name,duration:10}];
  block.items.forEach((it,i)=>{
    const sc=scaleBox(it.timer.work,it.timer.rest,lv);
    for(let r=1;r<=it.timer.rounds;r++){
      steps.push({phase:'work',label:it.name,sub:`Round ${r} of ${it.timer.rounds}`,duration:sc.work,combos:it.combos,round:r,total:it.timer.rounds});
      const last = r===it.timer.rounds && i===block.items.length-1;
      if(sc.rest>0 && !last){
        const nxt = r<it.timer.rounds ? it.name : (block.items[i+1]? block.items[i+1].name : 'Finish');
        steps.push({phase:'rest',label:'Rest',sub:'Next: '+nxt,duration:sc.rest});
      }
    }
  });
  steps.push({phase:'done',label:'Complete',sub:'',duration:0});
  return steps;
}
function hiitSeq(block,lv){
  const sc=scaleHiit(block.circuit.work,block.circuit.rest,block.circuit.rounds,lv);
  const steps=[{phase:'prep',label:'Get Ready',sub:block.name,duration:10}];
  for(let r=1;r<=sc.rounds;r++){
    steps.push({phase:'work',label:block.items[(r-1)%block.items.length].name,sub:`Round ${r} of ${sc.rounds}`,duration:sc.work,round:r,total:sc.rounds});
    if(r<sc.rounds) steps.push({phase:'rest',label:'Recovery',sub:'Next: '+block.items[r%block.items.length].name,duration:sc.rest});
  }
  steps.push({phase:'done',label:'Complete',sub:'',duration:0});
  return steps;
}

/* metrics */
function bodyweight(){
  if(S.weightLog.length) return S.weightLog[S.weightLog.length-1].weight;
  return S.settings.startWeight || 80;
}
function blockSeconds(block){
  const lv=levelOf();
  if(block.type==='strength')
    return block.items.reduce((a,it)=>a+it.sets*(45+it.rest),0);
  const seq = block.type==='boxing' ? boxingSeq(block,lv) : hiitSeq(block,lv);
  return seq.reduce((a,s)=>a+s.duration,0);
}
const blockMin = b => Math.round(blockSeconds(b)/60);
function blockKcal(block){
  return Math.round(TYPE[block.type].met*3.5*bodyweight()/200*(blockSeconds(block)/60));
}
const dayMin  = p => p.blocks.reduce((a,b)=>a+blockMin(b),0);
const dayKcal = p => p.blocks.reduce((a,b)=>a+blockKcal(b),0);

function dayItems(p){ return p.blocks.reduce((a,b)=>a.concat(b.items.map(i=>i.id)),[]); }
function doneCount(p){ return dayItems(p).filter(id=>S.checked[id]).length; }

function weekStart(){
  const d=new Date(); const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow); d.setHours(0,0,0,0); return d;
}
function sessionsThisWeek(){
  const ws=iso(weekStart());
  return S.sessions.filter(s=>s.date>=ws);
}
function weeklyPct(){
  const target=S.profile.daysPerWeek||2;
  return clamp(Math.round(sessionsThisWeek().length/target*100),0,100);
}
const totalKcal    = () => S.sessions.reduce((a,s)=>a+(s.calories||0),0);
const totalRounds  = () => S.sessions.reduce((a,s)=>a+(s.boxingRounds||0),0);
const hiitSessions = () => S.sessions.filter(s=>(s.hiitRounds||0)>0).length;

function currentW(){ return S.weightLog.length ? S.weightLog[S.weightLog.length-1].weight : S.settings.startWeight; }
function toGo(){
  const c=currentW(), t=S.settings.targetWeight;
  return (c!=null&&t!=null) ? Math.max(0,r1(c-t)) : null;
}
function goalPct(){
  const st=S.settings.startWeight, c=currentW(), t=S.settings.targetWeight;
  if(st==null||c==null||t==null||st===t) return 0;
  return clamp(Math.round((st-c)/(st-t)*100),0,100);
}
function prFor(id){
  const log=S.setLog[id]; if(!log||!log.length) return null;
  return log.reduce((m,s)=>Math.max(m,s.weight||0),0)||null;
}
function lastPerf(id){
  const log=S.setLog[id]; if(!log||!log.length) return null;
  const last=log[log.length-1].date;
  const sets=log.filter(s=>s.date===last);
  return {date:last, sets};
}
function findItem(id){
  for(const k in PLANS) for(const b of PLANS[k].blocks){
    const it=b.items.find(i=>i.id===id);
    if(it) return {item:it, block:b, plan:PLANS[k]};
  }
  return null;
}
function todayKey(){
  const d=new Date().getDay();
  return d===0 ? 'sunday' : 'saturday';
}

/* nutrition */
function nutTargets(){
  if(S.nutritionTargets) return S.nutritionTargets;
  const kg=bodyweight();
  const protein=Math.round(kg*2);
  const fats=Math.round(kg*0.9);
  const kcal=Math.round(kg*29);
  const carbs=Math.max(60,Math.round((kcal-protein*4-fats*9)/4));
  return {kcal, protein, carbs, fats, water:3000};
}
function nutFor(date){
  return S.nutrition[date] || {meals:[], water:0};
}
function nutTotals(date){
  const n=nutFor(date);
  return n.meals.reduce((a,m)=>({kcal:a.kcal+(+m.kcal||0),p:a.p+(+m.p||0),c:a.c+(+m.c||0),f:a.f+(+m.f||0)}),{kcal:0,p:0,c:0,f:0});
}

function ring(pct,size,stroke,color,inner){
  const r=(size-stroke)/2, C=2*Math.PI*r;
  const off=C*(1-clamp(pct,0,100)/100);
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg class="ring-svg" width="${size}" height="${size}">
      <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        stroke="${color}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        style="filter:drop-shadow(0 0 7px ${color}66)"/>
    </svg>
    <div class="ring-center">${inner||''}</div>
  </div>`;
}

const tile=(v,l,c)=>`<div class="tile"><div class="tv" ${c?`style="color:${c}"`:''}>${v}</div><div class="tl">${l}</div></div>`;

let view={name:'home', param:null};
let stack=[];

function go(name,param){
  if(view.name!==name || String(view.param)!==String(param)){
    stack.push({...view});
    if(stack.length>12) stack.shift();
  }
  view={name,param};
  render();
  $('#screen').scrollTop=0;
}
function goTab(name){ stack=[]; view={name,param:null}; render(); $('#screen').scrollTop=0; }
function back(){
  const prev=stack.pop();
  view = prev||{name:'home',param:null};
  render();
}

function chart(log){
  const W=360,H=170,pl=32,pr=12,pt=14,pb=26;
  if(log.length<2) return `<div class="empty">Log at least 2 weigh-ins to see your trend.</div>`;
  const ws=log.map(e=>e.weight);
  const goals=[S.settings.targetWeight].filter(g=>g!=null);
  const all=ws.concat(goals);
  let mn=Math.min(...all)-1.2, mx=Math.max(...all)+1.2;
  if(mx===mn){mx+=1;mn-=1;}
  const X=i=>pl+(i/(log.length-1))*(W-pl-pr);
  const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=log.map((e,i)=>`${X(i).toFixed(1)},${Y(e.weight).toFixed(1)}`).join(' ');
  const area=`${pl},${H-pb} ${pts} ${X(log.length-1).toFixed(1)},${H-pb}`;
  let g='';
  if(S.settings.targetWeight!=null){
    const gy=Y(S.settings.targetWeight);
    g=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="var(--success)" stroke-width="1.2" stroke-dasharray="4,4"/>
       <text x="${W-pr}" y="${gy-6}" fill="#35D07F" font-size="9.5" font-weight="600" text-anchor="end" font-family="Inter">Target</text>`;
  }
  const ticks=[mx,(mx+mn)/2,mn].map(v=>
    `<text x="${pl-7}" y="${(Y(v)+3).toFixed(1)}" fill="#9299A8" font-size="9" text-anchor="end" font-family="Inter">${r1(v)}</text>
     <line x1="${pl}" y1="${Y(v).toFixed(1)}" x2="${W-pr}" y2="${Y(v).toFixed(1)}" stroke="#272D38" stroke-width="1" ${v===mn?'':'stroke-dasharray="2,4"'}/>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5865F2" stop-opacity=".38"/><stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks}${g}
    <polygon points="${area}" fill="url(#ga)"/>
    <polyline points="${pts}" fill="none" stroke="#7A86FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${log.map((e,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(e.weight).toFixed(1)}" r="${i===log.length-1?4:2.6}" fill="${i===log.length-1?'#FFFFFF':'#7A86FF'}" ${i===log.length-1?'stroke="#5865F2" stroke-width="2.5"':''}/>`).join('')}
    <text x="${pl}" y="${H-6}" fill="#9299A8" font-size="9" font-family="Inter">${fmtDate(log[0].date)}</text>
    <text x="${W-pr}" y="${H-6}" fill="#9299A8" font-size="9" text-anchor="end" font-family="Inter">${fmtDate(log[log.length-1].date)}</text>
  </svg>`;
}

function strengthProg(){
  const ids=Object.keys(S.setLog).filter(id=>(S.setLog[id]||[]).length);
  if(!ids.length) return `<div class="card"><div class="empty">Log sets during a workout to track strength gains.</div></div>`;
  return `<div class="card" style="padding:6px 16px">
    ${ids.slice(0,6).map(id=>{
      const f=findItem(id); if(!f) return '';
      const log=S.setLog[id];
      const first=log[0].weight||0, best=prFor(id)||0;
      const gain=best-first;
      const dates=[...new Set(log.map(s=>s.date))].slice(-6);
      const spark=dates.map(d=>Math.max(...log.filter(s=>s.date===d).map(s=>s.weight||0)));
      const mx=Math.max(...spark,1);
      return `<div class="lrow">
        <div class="col" style="flex:1;min-width:0">
          <div class="nm">${esc(f.item.name)}</div>
          <div class="sb">${best} kg best ${gain>0?`- <span style="color:var(--success)">+${r1(gain)} kg</span>`:''}</div>
        </div>
        <div class="row" style="gap:3px;align-items:flex-end;height:30px">
          ${spark.map(v=>`<span style="width:6px;border-radius:2px;background:${v>=mx?'var(--success)':'rgba(255,255,255,.18)'};height:${Math.max(15,v/mx*100)}%;display:block"></span>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function prList(){
  const rows=Object.keys(S.setLog).map(id=>({id,pr:prFor(id),f:findItem(id)}))
    .filter(r=>r.pr&&r.f).sort((a,b)=>b.pr-a.pr).slice(0,6);
  if(!rows.length) return `<div class="card"><div class="empty">No PRs yet. Log a weighted set to start.</div></div>`;
  return `<div class="card" style="padding:6px 16px">
    ${rows.map(r=>`<div class="lrow">
      <div class="idx" style="color:var(--boxing);border-color:rgba(255,138,61,.35)">${ico('trophy',14,2)}</div>
      <div class="col" style="flex:1"><div class="nm">${esc(r.f.item.name)}</div>

      <div class="metric-sm" style="font-size:19px">${r.pr}<span class="muted" style="font-size:12px"> kg</span></div>
    </div>`).join('')}

}

/* =========================================================
   TIMER ENGINE (boxing / hiit / rest)
   ========================================================= */
let T=null; // {steps, i, remaining, paused, raf, mode, blockId, onDone, history}

function startTimer(mode,block,onDone){
  const lv=levelOf();
  const steps = mode==='boxing' ? boxingSeq(block,lv) : hiitSeq(block,lv);
  T={steps,i:0,remaining:steps[0].duration,paused:false,raf:null,mode,block,onDone,history:[],last:Date.now()};
  drawTimer(true);
  loop();
}
function loop(){
  cancelAnimationFrame(T&&T.raf);
  const tick=()=>{
    if(!T) return;
    if(!T.paused){
      const now=Date.now();
      T.remaining-=(now-T.last)/1000;
      T.last=now;
      if(T.remaining<=0){ next(); }
      else updateClock();
    } else T.last=Date.now();
    if(T) T.raf=requestAnimationFrame(tick);
  };
  T.raf=requestAnimationFrame(tick);
}
function next(){
  if(!T) return;
  const cur=T.steps[T.i];
  if(cur.phase==='work') T.history.push({label:cur.label,sub:cur.sub,dur:cur.duration});
  if(cur.phase==='done'){ return; }
  T.i++;
  if(T.i>=T.steps.length){ finishTimer(); return; }
  T.remaining=T.steps[T.i].duration;
  drawTimer(true);
  if(T.steps[T.i].phase==='done'){
    beep(1180,.4); buzz([90,70,90,70,200]);
    setTimeout(()=>{ if(T) finishTimer(); },1500);
  }
}
function finishTimer(){
  const cb=T&&T.onDone, hist=T?T.history:[];
  if(T&&T.raf) cancelAnimationFrame(T.raf);
  T=null;
  closeOverlay('timer');
  if(cb) cb(hist);
}
function endTimer(){
  if(T&&T.raf) cancelAnimationFrame(T.raf);
  T=null;
  closeOverlay('timer');
  if(active) renderActive();
}
function updateClock(){
  const c=document.getElementById('tClock');
  if(c) c.textContent=clock(T.remaining);
  const st=T.steps[T.i];
  const f=document.getElementById('tRingFill');
  if(f&&st.duration){
    const r=+f.getAttribute('r'), C=2*Math.PI*r;
    f.style.transition='none';
    f.setAttribute('stroke-dashoffset',(C*(1-T.remaining/st.duration)).toFixed(1));
  }
}
function drawTimer(isNew){
  const st=T.steps[T.i];
  const boxing=T.mode==='boxing';
  const accent = st.phase==='rest' ? 'var(--success)' : st.phase==='prep' ? 'var(--accent)' : (boxing?'var(--boxing)':'var(--hiit)');
  const phaseName = st.phase==='prep'?'GET READY':st.phase==='rest'?(boxing?'REST':'RECOVERY'):st.phase==='done'?'COMPLETE':'WORK';
  const nxt=T.steps[T.i+1];
  const rounds = st.total||0, rnd=st.round||0;
  const totalRounds = T.steps.filter(s=>s.phase==='work').length;
  const doneRounds  = T.steps.slice(0,T.i).filter(s=>s.phase==='work').length;

  const html=`<div class="ovl ${st.phase}" id="ovl-timer">
    <div class="row">
      <button class="iconbtn" data-act="timer-end">${ico('x',18,2.2)}</button>
      <div class="col" style="flex:1;text-align:center">
        <div class="eyebrow" style="color:${accent}">${boxing?'Boxing':'HIIT'} Timer</div>
        <div class="h3" style="margin-top:2px">${esc(T.block.name)}</div>
      </div>
      <div style="width:38px"></div>
    </div>

    <div class="col" style="flex:1;justify-content:center;align-items:center;gap:20px">
      <div class="eyebrow ${st.phase==='work'?'blink':''}" style="color:${accent};font-size:13px;letter-spacing:.22em">${phaseName}</div>

      ${ring(0,264,14,accent,`
        <div class="col" style="gap:6px;align-items:center">
          <div class="metric num ${isNew?'tick':''}" id="tClock" style="font-size:63px">${clock(T.remaining)}</div>
          <div class="h3" style="max-width:200px;text-align:center">${esc(st.label)}</div>
          ${rnd?`<div class="chip ${boxing?'boxing':'hiit'}" style="margin-top:3px">ROUND ${rnd} / ${rounds}</div>`:
                `<div class="tiny muted">${esc(st.sub||'')}</div>`}
        </div>`).replace('class="ring-fill"','class="ring-fill" id="tRingFill"')}

      ${st.phase==='rest'?`<div class="chip success">${ico('clock',13,2)} Next up: ${esc((st.sub||'').replace('Next: ',''))}</div>`:''}

      ${boxing&&st.combos&&st.phase==='work'?`
        <div class="row" style="gap:7px;flex-wrap:wrap;justify-content:center;max-width:330px">
          ${st.combos.map(c=>`<span class="chip boxing">${esc(c)}</span>`).join('')}
        </div>`:''}

      <div style="width:100%;max-width:330px">
        ${bar(doneRounds/totalRounds*100,boxing?'boxing':'hiit')}
        <div class="row" style="justify-content:space-between;margin-top:8px">
          <span class="tiny muted">${doneRounds} of ${totalRounds} rounds</span>
          <span class="tiny muted">${nxt&&nxt.phase!=='done'?'Next: '+esc(nxt.label):'Last one'}</span>
        </div>
      </div>

      ${T.history.length?`<div class="row" style="gap:5px;flex-wrap:wrap;justify-content:center;max-width:330px">
        ${T.history.slice(-8).map((h,i)=>`<span class="chip success" style="padding:4px 9px">${ico('check',11,3)} ${esc(h.label.slice(0,14))}</span>`).join('')}
      </div>`:''}
    </div>

    <div class="row" style="gap:10px">
      <button class="btn ghost" style="flex:1" data-act="timer-pause">${ico(T.paused?'play':'pause',18,2.2)} ${T.paused?'Resume':'Pause'}</button>
      <button class="btn ghost" style="flex:1" data-act="timer-skip">${ico('skip',17,2.2)} Skip</button>
    </div>
    <button class="btn ${boxing?'boxing':'hiit'}" style="margin-top:10px" data-act="timer-end">End Session</button>
  </div>`;

  setOverlay('timer',html);
  if(isNew){
    const f=st.phase==='prep'?520:st.phase==='work'?880:st.phase==='rest'?620:1180;
    beep(f,.22);
    buzz(st.phase==='work'?[120]:[60]);
  }
}

/* rest timer (between strength sets) */
let restT=null;
function startRest(sec,onDone){
  restT={remaining:sec,total:sec,last:Date.now(),raf:null,onDone};
  drawRest();
  const tick=()=>{
    if(!restT) return;
    const now=Date.now();
    restT.remaining-=(now-restT.last)/1000; restT.last=now;
    if(restT.remaining<=0){ const cb=restT.onDone; stopRest(); beep(880,.28); buzz([110,60,110]); if(cb)cb(); return; }
    const c=document.getElementById('rClock');
    if(c) c.textContent=clock(restT.remaining);
    const f=document.getElementById('rRingFill');
    if(f){ const r=+f.getAttribute('r'),C=2*Math.PI*r; f.style.transition='none'; f.setAttribute('stroke-dashoffset',(C*(1-restT.remaining/restT.total)).toFixed(1)); }
    restT.raf=requestAnimationFrame(tick);
  };
  restT.raf=requestAnimationFrame(tick);
}
function stopRest(){ if(restT&&restT.raf) cancelAnimationFrame(restT.raf); restT=null; closeOverlay('rest'); }
function drawRest(){
  setOverlay('rest',`<div class="modal-bg" data-act="rest-skip">
    <div class="sheet" style="text-align:center">
      <div class="grab"></div>
      <div class="eyebrow" style="color:var(--success)">Rest</div>
      <div style="display:grid;place-items:center;margin:18px 0">
        ${ring(0,180,12,'var(--success)',`<div class="metric num" id="rClock">${clock(restT.remaining)}</div>`).replace('class="ring-fill"','class="ring-fill" id="rRingFill"')}
      </div>
      <button class="btn success" data-act="rest-skip">Skip Rest</button>
    </div></div>`);
}

/* =========================================================
   ACTIVE WORKOUT
   ========================================================= */
let active=null; // {dayKey, stations, idx, setIdx, started, log:[], rounds, hiit}

function buildStations(plan){
  const st=[];
  plan.blocks.forEach(b=>{
    if(b.type==='strength') b.items.forEach(it=>st.push({kind:'strength',block:b,item:it}));
    else st.push({kind:b.type,block:b});
  });
  return st;
}
function startWorkout(dayKey){
  const plan=PLANS[dayKey];
  active={dayKey, stations:buildStations(plan), idx:0, setIdx:1, started:Date.now(), rounds:0, hiit:0, done:[], kcal:0, volume:0};
  renderActive();
}
function totalUnits(){
  return active.stations.reduce((a,s)=>a+(s.kind==='strength'?s.item.sets:1),0);
}
function doneUnits(){
  let n=0;
  for(let i=0;i<active.idx;i++) n+=active.stations[i].kind==='strength'?active.stations[i].item.sets:1;
  if(active.stations[active.idx]&&active.stations[active.idx].kind==='strength') n+=active.setIdx-1;
  return n;
}
function renderActive(){
  if(!active) return;
  const s=active.stations[active.idx];
  if(!s) return renderFinish();
  const plan=PLANS[active.dayKey];
  const pct=doneUnits()/totalUnits()*100;
  const nxt=active.stations[active.idx+1];
  const elapsed=Math.round((Date.now()-active.started)/60000);
  const t=TYPE[s.kind];

  const body = s.kind==='strength' ? activeStrength(s) : activeTimerStation(s);

  setOverlay('active',`<div class="ovl" id="ovl-active">
    <div class="row">
      <button class="iconbtn" data-act="active-quit">${ico('x',18,2.2)}</button>
      <div class="col" style="flex:1;text-align:center">
        <div class="eyebrow" style="color:var(--accent)">${plan.label} - ${elapsed} min</div>
        <div class="h3" style="margin-top:2px">${esc(s.block.name)}</div>
      </div>
      <button class="iconbtn" data-act="active-skip">${ico('skip',16,2.2)}</button>
    </div>

    <div style="margin-top:16px">
      ${bar(pct,'success')}
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <span class="tiny muted">${Math.round(pct)}% complete</span>
        <span class="tiny muted">${nxt?'Next: '+esc(nxt.kind==='strength'?nxt.item.name:nxt.block.name):'Final station'}</span>
      </div>
    </div>

    ${body}
  </div>`);
}
function activeStrength(s){
  const it=s.item, lp=lastPerf(it.id), pr=prFor(it.id);
  const prev=lp&&lp.sets[Math.min(active.setIdx-1,lp.sets.length-1)];
  return `<div class="col" style="flex:1;justify-content:center;gap:18px">
    <div class="col" style="align-items:center;gap:9px;text-align:center">
      <span class="chip strength">${ico('dumbbell',13,2)} Strength</span>
      <div class="h1" style="font-size:32px">${esc(it.name)}</div>
      <div class="small muted">${(it.muscles||[]).join(' - ')}</div>
    </div>

    <div style="display:grid;place-items:center">
      ${ring((active.setIdx-1)/it.sets*100,190,12,'var(--success)',
        `<div class="col" style="gap:2px;align-items:center">
          <div class="eyebrow">Set</div>
          <div class="metric" style="font-size:52px">${active.setIdx}</div>
          <div class="tiny muted">of ${it.sets}</div>
        </div>`)}
    </div>

    <div class="grid2">
      <div class="field" style="margin:0"><label>Reps (target ${esc(it.reps)})</label>
        <input class="input" id="aw-reps" type="number" inputmode="numeric" style="height:56px;font-size:19px;text-align:center"
          placeholder="${esc(String(it.reps).split(/[^0-9]/)[0]||'8')}" value="${prev?prev.reps:''}"></div>
      <div class="field" style="margin:0"><label>Weight (kg)</label>
        <input class="input" id="aw-wt" type="number" inputmode="decimal" step="0.5" style="height:56px;font-size:19px;text-align:center"
          placeholder="0" value="${prev?prev.weight:''}"></div>
    </div>
    ${prev||pr?`<div class="row" style="gap:7px;justify-content:center">
      ${prev?`<span class="chip">Last: ${prev.reps} x ${prev.weight||0}kg</span>`:''}
      ${pr?`<span class="chip success">${ico('trophy',12,2)} PR ${pr}kg</span>`:''}
    </div>`:''}
  </div>

  <button class="btn success" data-act="active-set">${ico('check',19,2.4)} Complete Set</button>`;
}
function activeTimerStation(s){
  const t=TYPE[s.kind], boxing=s.kind==='boxing';
  return `<div class="col" style="flex:1;justify-content:center;gap:20px;align-items:center;text-align:center">
    <span class="chip ${t.chip}">${ico(t.icon,13,2)} ${t.label}</span>
    <div class="h1" style="font-size:32px">${esc(s.block.name)}</div>
    <div class="small muted" style="max-width:300px">${s.block.items.map(i=>esc(i.name)).join(' - ')}</div>
    <div class="grid2" style="width:100%;max-width:300px">
      ${tile(blockMin(s.block),'Minutes')}
      ${tile(blockKcal(s.block),'Kcal',t.color)}
    </div>
  </div>
  <button class="btn ${boxing?'boxing':'hiit'}" data-act="active-timer">${ico('play',19,2.2)} Start ${s.block.name}</button>
  <button class="btn ghost sm" style="margin-top:9px" data-act="active-skip">Skip this block</button>`;
}
function stationKcal(s){
  const bw=bodyweight();
  if(s.kind==='strength') return Math.round(TYPE.strength.met*3.5*bw/200*(s.item.sets*(45+s.item.rest)/60));
  return blockKcal(s.block);
}
function advance(completed){
  const s=active.stations[active.idx];
  if(s && completed){
    if(s.kind==='strength') active.done.push(s.item.id);
    else s.block.items.forEach(i=>active.done.push(i.id));
    active.kcal+=stationKcal(s);
  }
  active.idx++; active.setIdx=1;
  if(active.idx>=active.stations.length) renderFinish();
  else renderActive();
}
function renderFinish(){
  const plan=PLANS[active.dayKey];
  const mins=Math.max(1,Math.round((Date.now()-active.started)/60000));
  const ids=dayItems(plan);
  const counted=new Set(active.done).size;
  const sess={
    date:iso(), day:active.dayKey, durationMin:mins,
    calories:Math.round(active.kcal),
    exCount:counted, exTotal:ids.length,
    boxingRounds:active.rounds, hiitRounds:active.hiit,
    volume:Math.round(active.volume||0)
  };
  S.sessions.push(sess);
  ids.forEach(id=>delete S.checked[id]);
  save();

  setOverlay('active',`<div class="ovl" id="ovl-active" style="background:radial-gradient(700px 460px at 50% 26%,rgba(53,208,127,.2),transparent 66%),var(--bg)">
    <div class="col" style="flex:1;justify-content:center;align-items:center;text-align:center;gap:20px">
      <div class="pop" style="width:104px;height:104px;border-radius:50%;display:grid;place-items:center;color:#04240F;
        background:linear-gradient(140deg,#45DE8E,#22B86A);box-shadow:0 14px 40px rgba(53,208,127,.42)">${ico('check',52,3)}</div>
      <div class="col" style="gap:7px">
        <div class="h1" style="font-size:30px">Session complete</div>
        <div class="muted small">${esc(plan.title)}</div>
      </div>
      <div class="grid3" style="width:100%;max-width:330px">
        ${tile(mins,'Minutes')}
        ${tile(sess.calories,'Kcal','var(--boxing)')}
        ${tile(counted+'/'+ids.length,'Exercises','var(--success)')}
      </div>
      ${active.rounds?`<span class="chip boxing">${active.rounds} boxing rounds</span>`:''}
    </div>
    <button class="btn success" data-act="active-done">Done</button>
  </div>`);
  beep(1180,.45); buzz([90,60,90,60,200]);
  active=null;
}

/* =========================================================
   OVERLAYS
   ========================================================= */
const overlays={};
function setOverlay(k,html){ overlays[k]=html; paintOverlays(); }
function closeOverlay(k){ delete overlays[k]; paintOverlays(); }
function paintOverlays(){ $('#overlayRoot').innerHTML=Object.values(overlays).join(''); }

function sheet(title,body,sub){
  return `<div class="modal-bg" data-act="close-sheet">
    <div class="sheet">
      <div class="grab"></div>
      <div class="h2">${esc(title)}</div>
      ${sub?`<div class="small muted" style="margin-top:5px">${esc(sub)}</div>`:''}
      <div style="margin-top:16px">${body}</div>
    </div></div>`;
}

/* =========================================================
   ACTIONS
   ========================================================= */
const ACT={
  tab:v=>goTab(v),
  nav:v=>go(v),
  back:()=>back(),
  'to-splash':()=>{ view={name:'splash'}; render(); },
  onboard:()=>{ view={name:'onboard'}; render(); },
  login:()=>{ S.onboarded=true; save(); goTab('home'); },
  'onboard-save':()=>{
    const g=id=>document.getElementById(id);
    const cur=parseFloat(g('ob-cur').value), tgt=parseFloat(g('ob-tgt').value);
    S.profile.name=g('ob-name').value.trim();
    S.profile.daysPerWeek=+g('ob-days').value;
    S.profile.level=g('ob-level').value;
    S.settings.timelineWeeks=+g('ob-weeks').value;
    if(!isNaN(cur)){ S.settings.startWeight=cur; if(!S.weightLog.length) S.weightLog.push({date:iso(),weight:cur}); }
    if(!isNaN(tgt)) S.settings.targetWeight=tgt;
    S.onboarded=true; save(); goTab('home');
  },
  'plan-tab':v=>{ planTab=v; render(); },
  'open-day':v=>{ planTab=v; goTab('workouts'); },
  'open-ex':v=>go('exercise',v),
  quick:v=>{
    const b=[].concat(...Object.values(PLANS).map(p=>p.blocks)).find(x=>x.id===v);
    if(!b) return;
    if(b.type==='strength'){ planTab=v.startsWith('sat')?'saturday':'sunday'; goTab('workouts'); }
    else startTimer(b.type==='boxing'?'boxing':'hiit',b,()=>{});
  },
  'start-day':v=>startWorkout(v),
  'start-block':v=>{
    const b=[].concat(...Object.values(PLANS).map(p=>p.blocks)).find(x=>x.id===v);
    if(!b) return;
    startTimer(b.type==='boxing'?'boxing':'hiit',b,hist=>{
      b.items.forEach(i=>{S.checked[i.id]=true;});
      save(); render();
    });
  },
  'timer-pause':()=>{ if(T){T.paused=!T.paused; drawTimer(false);} },
  'timer-skip':()=>{ if(T) next(); },
  'timer-end':()=>endTimer(),
  'rest-timer':v=>startRest(+v,()=>{}),
  'rest-skip':()=>stopRest(),
  'log-set':v=>{
    const reps=parseInt(document.getElementById('ex-reps').value,10);
    const wt=parseFloat(document.getElementById('ex-wt').value);
    if(isNaN(reps)) return toast('Enter your reps');
    (S.setLog[v]=S.setLog[v]||[]).push({date:iso(),reps,weight:isNaN(wt)?0:wt});
    const f=findItem(v);
    const todaySets=S.setLog[v].filter(s=>s.date===iso()).length;
    if(f&&todaySets>=f.item.sets) S.checked[v]=true;
    save(); render();
    buzz(60); beep(760,.14);
    if(f) startRest(f.item.rest,()=>{});
  },
  'active-set':()=>{
    const s=active.stations[active.idx], it=s.item;
    const reps=parseInt(document.getElementById('aw-reps').value,10);
    const wt=parseFloat(document.getElementById('aw-wt').value);
    if(isNaN(reps)) return toast('Enter your reps');
    const w=isNaN(wt)?0:wt;
    (S.setLog[it.id]=S.setLog[it.id]||[]).push({date:iso(),reps,weight:w});
    active.volume=(active.volume||0)+reps*w;
    save(); buzz(60); beep(760,.14);
    if(active.setIdx>=it.sets){ S.checked[it.id]=true; save(); advance(true); }
    else{ active.setIdx++; renderActive(); startRest(it.rest,()=>{}); }
  },
  'active-timer':()=>{
    const s=active.stations[active.idx];
    startTimer(s.kind==='boxing'?'boxing':'hiit',s.block,hist=>{
      if(s.kind==='boxing') active.rounds+=hist.length;
      else active.hiit+=hist.length;
      s.block.items.forEach(i=>{S.checked[i.id]=true;});
      save(); advance(true);
    });
  },
  'active-skip':()=>advance(false),
  'active-quit':()=>{
    if(confirm('End this workout? Completed sets are already saved.')){
      active=null; closeOverlay('active'); render();
    }
  },
  'active-done':()=>{ closeOverlay('active'); goTab('home'); },
  'add-weight':()=>{
    const el=document.getElementById('w-in');
    const v=parseFloat(el.value);
    if(isNaN(v)) return toast('Enter a weight');
    const d=iso(), ex=S.weightLog.find(e=>e.date===d);
    if(ex) ex.weight=v; else S.weightLog.push({date:d,weight:v});
    S.weightLog.sort((a,b)=>a.date<b.date?-1:1);
    if(S.settings.startWeight==null) S.settings.startWeight=v;
    save(); render(); toast('Weigh-in logged'); buzz(50);
  },
  'save-profile':()=>{
    const g=id=>document.getElementById(id);
    const st=parseFloat(g('p-start').value), tg=parseFloat(g('p-target').value);
    S.settings.startWeight=isNaN(st)?null:st;
    S.settings.targetWeight=isNaN(tg)?null:tg;
    S.settings.timelineWeeks=+g('p-weeks').value;
    S.profile.daysPerWeek=+g('p-days').value;
    S.profile.level=g('p-level').value;
    S.profile.units=g('p-units').value;
    S.profile.name=g('p-name').value.trim();
    save(); render(); toast('Profile saved');
  },
  'toggle-notif':()=>{ S.settings.notifications=!S.settings.notifications; save(); render(); },
  water:v=>{
    const d=iso(); const n=S.nutrition[d]=S.nutrition[d]||{meals:[],water:0};
    n.water=Math.max(0,n.water+ +v); save(); render(); buzz(40);
  },
  'add-meal-sheet':v=>{
    const nt=nutTargets();
    setOverlay('sheet',sheet('Add food',`
      <div class="field"><label>Meal</label>
        <select class="input" id="m-type">${MEAL_TYPES.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Name</label><input class="input" id="m-name" placeholder="Chicken and rice"></div>
      <div class="grid2">
        <div class="field"><label>Calories</label><input class="input" id="m-kcal" type="number" inputmode="numeric" placeholder="520"></div>
        <div class="field"><label>Protein (g)</label><input class="input" id="m-p" type="number" inputmode="numeric" placeholder="45"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Carbs (g)</label><input class="input" id="m-c" type="number" inputmode="numeric" placeholder="60"></div>
        <div class="field"><label>Fats (g)</label><input class="input" id="m-f" type="number" inputmode="numeric" placeholder="12"></div>
      </div>
      <button class="btn primary" style="margin-top:6px" data-act="add-meal">Add to log</button>`,
      `Daily target ${nt.kcal} kcal`));
  },
  'add-meal':()=>{
    const g=id=>document.getElementById(id);
    const name=g('m-name').value.trim(), kcal=parseInt(g('m-kcal').value,10);
    if(!name||isNaN(kcal)) return toast('Add a name and calories');
    const d=iso(); const n=S.nutrition[d]=S.nutrition[d]||{meals:[],water:0};
    n.meals.push({id:'m'+Date.now(),type:g('m-type').value,name,kcal,
      p:+g('m-p').value||0,c:+g('m-c').value||0,f:+g('m-f').value||0});
    save(); closeOverlay('sheet'); render(); toast('Food logged'); buzz(50);
  },
  'del-meal':v=>{
    const d=iso(), n=S.nutrition[d];
    if(!n) return;
    n.meals=n.meals.filter(m=>m.id!==v);
    save(); render();
  },
  'targets-sheet':()=>{
    const t=nutTargets();
    setOverlay('sheet',sheet('Daily targets',`
      <div class="grid2">
        <div class="field"><label>Calories</label><input class="input" id="t-kcal" type="number" value="${t.kcal}"></div>
        <div class="field"><label>Protein (g)</label><input class="input" id="t-p" type="number" value="${t.protein}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Carbs (g)</label><input class="input" id="t-c" type="number" value="${t.carbs}"></div>
        <div class="field"><label>Fats (g)</label><input class="input" id="t-f" type="number" value="${t.fats}"></div>
      </div>
      <div class="field"><label>Water (ml)</label><input class="input" id="t-w" type="number" value="${t.water}"></div>
      <button class="btn primary" data-act="save-targets">Save targets</button>
      <button class="btn ghost sm" style="margin-top:9px" data-act="reset-targets">Recalculate from bodyweight</button>`));
  },
  'save-targets':()=>{
    const g=id=>+document.getElementById(id).value||0;
    S.nutritionTargets={kcal:g('t-kcal'),protein:g('t-p'),carbs:g('t-c'),fats:g('t-f'),water:g('t-w')};
    save(); closeOverlay('sheet'); render(); toast('Targets updated');
  },
  'reset-targets':()=>{ S.nutritionTargets=null; save(); closeOverlay('sheet'); render(); },
  'backup-sheet':()=>{
    setOverlay('sheet',sheet('Backup & restore',`
      <textarea class="input" id="bk" spellcheck="false">${esc(JSON.stringify(S))}</textarea>
      <div class="row" style="gap:9px;margin-top:4px">
        <button class="btn sm" style="flex:1" data-act="copy-backup">Copy</button>
        <button class="btn sm primary" style="flex:1" data-act="restore-backup">Restore</button>
      </div>`,'Copy this somewhere safe, or paste a previous backup and restore it.'));
  },
  'copy-backup':()=>{
    const ta=document.getElementById('bk'); ta.select();
    try{ navigator.clipboard.writeText(ta.value); }catch(e){ try{document.execCommand('copy');}catch(e2){} }
    toast('Copied to clipboard');
  },
  'restore-backup':()=>{
    try{
      const p=JSON.parse(document.getElementById('bk').value);
      if(!p||typeof p!=='object'||!Array.isArray(p.weightLog)||!Array.isArray(p.sessions)) throw 0;
      hydrate(JSON.stringify(p)); save(); closeOverlay('sheet'); render(); toast('Data restored');
    }catch(e){ toast("That doesn't look like valid backup data"); }
  },
  'reset-confirm':()=>{
    setOverlay('sheet',sheet('Reset all data',`
      <button class="btn hiit" data-act="reset-do">Yes, wipe everything</button>
      <button class="btn ghost sm" style="margin-top:9px" data-act="close-sheet">Cancel</button>`,
      'Weigh-ins, sessions, set logs and nutrition will be permanently deleted.'));
  },
  'reset-do':()=>{
    const keep={profile:S.profile,settings:S.settings,onboarded:true};
    S=Object.assign(blankState(),keep);
    save(); closeOverlay('sheet'); goTab('home'); toast('All data reset');
  },
  'close-sheet':()=>closeOverlay('sheet')
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  // backdrops only respond to a direct hit, so taps inside the sheet don't dismiss it
  if(el.classList.contains('modal-bg') && e.target!==el) return;
  const fn=ACT[el.getAttribute('data-act')];
  if(!fn) return;
  e.preventDefault();
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),520);
  fn(el.getAttribute('data-v'));
});

/* toast */
let toastT=null;
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:absolute;left:50%;transform:translateX(-50%);bottom:104px;z-index:99;'+
      'background:var(--card-elev);border:1px solid var(--border);color:var(--text);padding:11px 18px;'+
      'border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);pointer-events:none;'+
      'opacity:0;transition:opacity .22s,transform .22s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis';
    $('#app').appendChild(t);
  }
  t.textContent=msg;
  requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(-6px)'; });
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%)'; },1900);
}

/* =========================================================
   BOOT
   ========================================================= */
function boot(){
  view={name:S.onboarded?'home':'splash',param:null};
  render();
}
if(!STORE){
  showWarn(); boot();
}else{
  Promise.resolve(loadState()).then(boot).catch(boot);
}

})();
</script>
